[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "rate-shopper"
version = "0.3.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "httpx>=0.28,<1"]
[project.optional-dependencies]
browser = ["playwright>=1.49,<2"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "mypy>=1.14,<2"]
[project.scripts]
rate-shopper = "rate_shopper.cli.main:main"
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/rate_shopper"]
